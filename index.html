<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>李思雨 · 生日时光纪念册</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 背景层 -->
<div class="bg-layer" id="bgLayer"></div>
<div class="bg-overlay"></div>
<div class="progress" id="progress"></div>

<!-- 翻页容器（由 js/app.js 动态填充） -->
<div class="pages" id="pages"></div>

<!-- 页码指示器 -->
<div class="pager" id="pager"></div>

<!-- 翻页按钮 -->
<button class="nav-btn nav-prev hidden" id="btnPrev" aria-label="上一页">‹</button>
<button class="nav-btn nav-next" id="btnNext" aria-label="下一页">›</button>

<!-- 音乐控制按钮 -->
<button class="music-btn" id="musicBtn" aria-label="播放/暂停背景音乐" title="播放/暂停背景音乐">
  <span class="music-icon">
    <span class="bar"></span><span class="bar"></span><span class="bar"></span><span class="bar"></span>
  </span>
</button>
<audio id="bgMusic" loop preload="auto"></audio>

<!-- 滑动提示 -->
<div class="swipe-hint" id="swipeHint">
  <span class="arrow">←</span> 左右滑动翻页 <span class="arrow">→</span>
</div>

<!-- 先加载数据（在 app.js 之前），避免 file:// 协议 CORS 限制 -->
<script src="data/pages.js"></script>
<script src="js/app.js"></script>
</body>
</html>
